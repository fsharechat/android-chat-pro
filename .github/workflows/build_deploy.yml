name: Android Build and Release

on:
  push:
    tags:
      - 'v*'  # 只有以 'v' 开头的标签才会触发工作流程

jobs:
  build-and-release:

    runs-on: ubuntu-latest

    steps:
    - name: Set up JDK 8
      uses: actions/setup-java@v2
      with:
        java-version: '8'
        distribution: 'adopt'

    - name: Checkout code
      uses: actions/checkout@v2

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Deploy to File server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        password: ${{ secrets.SERVER_PASSWORD }}
        source: "chat/build/outputs/apk/release/chat-release.apk"
        target: "/data0/minio/miniodata/minio-bucket-file-name/"  # 更改为您的目标服务器目录

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}  # 使用提取的版本号作为标签名称
        release_name: Release ${{ github.ref }}  # 使用提取的版本号作为发布名称
        draft: false
        prerelease: false

    - name: Upload APK artifact
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: chat/build/outputs/apk/release/chat-release.apk
        asset_name: fsharechat-release-${{ github.ref_name }}.apk
        asset_content_type: application/vnd.android.package-archive