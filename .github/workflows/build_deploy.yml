name: Android Build and Release

on:
  push:
    tags:
      - 'v*'  # 只有以 'v' 开头的标签才会触发工作流程
#on:
#  push:
#    branches:
#      - master  # 更改为您的主要分支名称

jobs:
  build-and-release:

    runs-on: ubuntu-latest

    steps:
    - name: Set up JDK 11
      uses: actions/setup-java@v2
      with:
        java-version: '11'
        distribution: 'adopt'

    - name: Checkout code
      uses: actions/checkout@v2

    # 预装项目所需的旧版 SDK 组件，避免 AGP 3.4 自带的旧 sdklib
    # 去解析新版 Google 仓库元数据时报错（'35x' is not a valid integer）
    # sdkmanager 需要 Java 17，这一步单独用 runner 预装的 JDK 17，
    # 不影响后面 Gradle 用 JDK 11 构建
    - name: Install Android SDK components
      run: |
        export JAVA_HOME="$JAVA_HOME_17_X64"
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
          "platforms;android-29" "platforms;android-28" "build-tools;28.0.3"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    # chat/build.gradle 会把产物改名为 Fsharechat-{版本}-{日期}.apk，
    # 后续部署/上传步骤写死了 chat-release.apk，这里统一命名
    - name: Normalize APK name
      run: cp chat/build/outputs/apk/release/Fsharechat-*.apk chat/build/outputs/apk/release/chat-release.apk

#    - name: Deploy to File server
#      uses: appleboy/scp-action@master
#      with:
#        host: ${{ secrets.SERVER_HOST }}
#        username: ${{ secrets.SERVER_USERNAME }}
#        password: ${{ secrets.SERVER_PASSWORD }}
#        source: "chat/build/outputs/apk/release/"
#        target: "/data0/minio/miniodata/minio-bucket-file-name/"  # 更改为您的目标服务器目录

    - name: Deploy to Server # 第二步，rsync推文件
      uses: easingthemes/ssh-deploy@v5.0.3 # 使用别人包装好的步骤镜像
      with:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        ARGS: '-avzr'
        REMOTE_HOST:  ${{ secrets.SERVER_HOST }}
        REMOTE_USER: ${{ secrets.SERVER_USERNAME }}
        SOURCE: 'chat/build/outputs/apk/release/chat-release.apk'
        TARGET: '/data/temp-release'

    - name: Copy release to minio server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cp -f /data/temp-release/chat-release.apk /data/minio/miniodata/minio-bucket-file-name/chat-release.apk

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}  # 使用提取的版本号作为标签名称
        release_name: Release ${{ github.ref }}  # 使用提取的版本号作为发布名称
        draft: false
        prerelease: false

    - name: Upload APK artifact
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: chat/build/outputs/apk/release/chat-release.apk
        asset_name: fsharechat-release-${{ github.ref_name }}.apk
        asset_content_type: application/vnd.android.package-archive