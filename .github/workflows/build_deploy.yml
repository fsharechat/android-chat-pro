name: Android Build and Release

on:
  push:
    tags:
      - 'v*'  # 只有以 'v' 开头的标签才会触发工作流程
#on:
#  push:
#    branches:
#      - master  # 更改为您的主要分支名称

jobs:
  build-and-release:

    runs-on: ubuntu-latest

    # 自带的 GITHUB_TOKEN 默认只读，创建 Release 需要 contents 写权限
    permissions:
      contents: write

    steps:
    # AdoptOpenJDK 已停止维护，改用 Temurin（Adoptium）发行版
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Checkout code
      uses: actions/checkout@v4

    # 预装项目所需的旧版 SDK 组件，避免 AGP 3.4 自带的旧 sdklib
    # 去解析新版 Google 仓库元数据时报错（'35x' is not a valid integer）
    # sdkmanager 需要 Java 17，这一步单独用 runner 预装的 JDK 17，
    # 不影响后面 Gradle 用 JDK 11 构建。
    # 装到单独的干净目录并让后续步骤只用它：runner 预装的 SDK 里有 android-34~37、
    # SDK extension、NDK 27 等新组件，AGP 3.4 解析它们的 package.xml 会打印上万行
    # 异常堆栈（不影响构建但淹没编译日志）
    - name: Install Android SDK components
      run: |
        export JAVA_HOME="$JAVA_HOME_17_X64"
        SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        SDK_DIR="$RUNNER_TEMP/android-sdk"
        yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses > /dev/null || true
        "$SDKMANAGER" --sdk_root="$SDK_DIR" \
          "platforms;android-29" "platforms;android-28" "build-tools;28.0.3"
        echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 项目不用 NDK；runner 的 ANDROID_NDK_HOME 指向 NDK 27，AGP 3.4 会报 NDK 缺 platforms 目录的警告
    - name: Build Release APK
      run: env -u ANDROID_NDK_HOME -u ANDROID_NDK_ROOT ./gradlew assembleRelease

    # chat/build.gradle 会把产物改名为 Fsharechat-{版本}-{日期}.apk，
    # 后续部署/上传步骤写死了 chat-release.apk，这里统一命名
    - name: Normalize APK name
      run: cp chat/build/outputs/apk/release/Fsharechat-*.apk chat/build/outputs/apk/release/chat-release.apk

#    - name: Deploy to File server
#      uses: appleboy/scp-action@master
#      with:
#        host: ${{ secrets.SERVER_HOST }}
#        username: ${{ secrets.SERVER_USERNAME }}
#        password: ${{ secrets.SERVER_PASSWORD }}
#        source: "chat/build/outputs/apk/release/"
#        target: "/data0/minio/miniodata/minio-bucket-file-name/"  # 更改为您的目标服务器目录

    - name: Deploy to Server # 第二步，rsync推文件
      uses: easingthemes/ssh-deploy@v5.0.3 # 使用别人包装好的步骤镜像
      with:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        ARGS: '-avzr'
        REMOTE_HOST:  ${{ secrets.SERVER_HOST }}
        REMOTE_USER: ${{ secrets.SERVER_USERNAME }}
        SOURCE: 'chat/build/outputs/apk/release/chat-release.apk'
        TARGET: '/data/temp-release'

    - name: Copy release to minio server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cp -f /data/temp-release/chat-release.apk /data/minio/miniodata/minio-bucket-file-name/chat-release.apk

    # actions/create-release 与 upload-release-asset 已归档不再维护，
    # 用 action-gh-release 一步完成建 Release 与上传 APK；附件名取自文件名，先复制一份
    - name: Prepare release asset
      run: cp chat/build/outputs/apk/release/chat-release.apk "fsharechat-release-${{ github.ref_name }}.apk"

    - name: Create Release and upload APK
      uses: softprops/action-gh-release@v2
      with:
        # 用 Actions 自带的 token，不依赖会过期的个人 token（PERSONAL_GITHUB_TOKEN 已失效）
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        files: fsharechat-release-${{ github.ref_name }}.apk